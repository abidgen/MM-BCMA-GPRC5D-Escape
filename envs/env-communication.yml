# Stage 11 only — LIANA+ (native Python reimplementation of CellChat's algorithm).
# Isolated because liana/omnipath's dependency tree is version-sensitive and
# unrelated to the core scanpy stack.
name: mm-communication
channels: [conda-forge, bioconda]
dependencies:
  - python=3.12
  - liana
  - omnipath
  - anndata
  - scanpy
  # bioconda's liana recipe under-declares: mudata needs pydantic, and mudata>=0.4
  # imports `Settings` from scverse_misc, which conda-forge's scverse-misc 0.1.3
  # does not export. Both pins are required for `import liana` to work at all.
  - pydantic
  - mudata<0.4
  - jupyterlab
  - ipykernel
  - jupytext
