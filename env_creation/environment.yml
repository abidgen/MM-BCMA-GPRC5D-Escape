name: mm-dual-antigen

channels:
  - dnachun        # r-cellchat
  - conda-forge
  - bioconda

# Create with:
#   mamba env create -f environment_updated.yml
# Then run once:
#   mamba run -n mm-dual-antigen Rscript install_cran_overrides.R

dependencies:
  # Core R / Python
  - r-base=4.3.3
  - r-essentials=4.3
  - python=3.11
  - pandas=2.2.2

  # CRAN packages
  - r-seurat=5.0.3
  - r-harmony=1.2.1
  - r-dplyr=1.1.4
  - r-ggplot2=3.5.2       # is_ggplot export required by Seurat
  - r-devtools=2.4.5
  - r-remotes=2.5.0
  - r-matrix=1.6_5
  - r-hdf5r=1.3.10

  # Bioconductor 3.18 / R 4.3 packages
  - bioconductor-scdblfinder=1.16.0
  - bioconductor-singler=2.4.0
  - bioconductor-celldex=1.12.0
  - bioconductor-infercnv=1.18.1
  - bioconductor-glmgampoi=1.14.0
  - bioconductor-singlecellexperiment=1.24.0
  - bioconductor-scran=1.30.0

  # Cell-cell communication
  - dnachun::r-cellchat=2.1.2

  # Conda currently supplies NMF 0.21.0, while CellChat needs >=0.23.0.
  # install_cran_overrides.R upgrades it from CRAN after environment creation.
  - r-nmf=0.21.0

  # Utilities
  - wget
  - pigz

